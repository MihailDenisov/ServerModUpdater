name: Release v1.2.0

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and validate
        run: chmod +x gradlew && ./gradlew build
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create v1.2.0 build/libs/ServerModUpdater-1.2.0.jar
          --target "$GITHUB_SHA"
          --title "ServerModUpdater v1.2.0"
          --notes "Server-only NeoForge 1.21.1 mod updater with optional AutoModpack integration, English/Russian localization, timestamped reports, verified downloads, .jar.old backups, and rollback."
